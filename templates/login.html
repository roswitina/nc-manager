{% extends 'base.html' %}
{% block body %}
<div class="card narrow">
  <h1>☁ Nextcloud Manager</h1>
  {% if err %}<p class="bad">{{ err }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="user">Benutzer</label><input id="user" name="user" autocomplete="username" autofocus>
    <label for="password">Passwort</label><input id="password" name="password" type="password" autocomplete="current-password">
    <button>Anmelden</button>
  </form>
</div>
{% endblock %}
